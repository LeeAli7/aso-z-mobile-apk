name: Build dev-client APK

# Собирается вручную: APK-«пульт», который грузит JS с Metro (expo start --dev-client).
# Ставится РЯДОМ с боевым Aso-z (другой пакет app.aso.zmobile.dev), данные не трогает.
on:
  workflow_dispatch:

jobs:
  dev-client:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-dev-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            gradle-dev-${{ runner.os }}-

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo prebuild (dev variant)
        env:
          APP_VARIANT: dev
        run: npx expo prebuild --platform android --no-install --clean

      - name: Force targetSdkVersion 28 (Android W^X exec fix)
        run: |
          cd android
          if grep -q 'targetSdkVersion rootProject.ext.targetSdkVersion' app/build.gradle; then
            sed -i 's/targetSdkVersion rootProject\.ext\.targetSdkVersion/targetSdkVersion 28/' app/build.gradle
          else
            echo "ERROR: expected line not found in app/build.gradle" >&2
            grep -n 'targetSdkVersion' app/build.gradle
            exit 1
          fi

      - name: Restrict ABIs to ARM (speed up CMake build)
        run: |
          cd android/app
          if ! grep -q 'abiFilters' build.gradle; then
            sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "arm64-v8a", "armeabi-v7a"\n        }' build.gradle
          fi

      - name: Build debug APK (dev-client)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Show result
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          ls "$ANDROID_HOME/build-tools" | tail -1 > /tmp/btver
          "$ANDROID_HOME/build-tools/$(cat /tmp/btver)/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aso-dev-client
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
