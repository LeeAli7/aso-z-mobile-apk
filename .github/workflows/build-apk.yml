name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Ensure release is signed with debug key
        run: |
          cd android/app
          if ! grep -q 'signingConfig signingConfigs.debug' build.gradle; then
            echo "Release buildType missing debug signing — patching"
            sed -i 's/^\(\s*\)release {/\1release {\n\1    signingConfig signingConfigs.debug/' build.gradle
          fi
          grep -A3 'release {' build.gradle | head -6

      - name: Restrict ABIs to ARM (speed up CMake build)
        run: |
          cd android/app
          if ! grep -q 'abiFilters' build.gradle; then
            sed -i '/defaultConfig {/a\        ndk {\n            abiFilters "arm64-v8a", "armeabi-v7a"\n        }' build.gradle
          fi
          echo "--- defaultConfig after patch:"
          grep -B1 -A8 'defaultConfig {' build.gradle | head -14

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          ls "$ANDROID_HOME/build-tools" | tail -1 > /tmp/btver
          "$ANDROID_HOME/build-tools/$(cat /tmp/btver)/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aso-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
